spring.application.name=ProjectServer
server.port=8081

# ── H2 file-based database ──────────────────────────────────────────────────
# Data is saved in ./data/cde_db.mv.db — survives server restarts
spring.datasource.url=jdbc:h2:file:./data/cde_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# "update" creates tables on first run and updates them if entities change
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── H2 web console ──────────────────────────────────────────────────────────
# Open http://localhost:8081/h2-console to browse the DB while the server runs
# JDBC URL: jdbc:h2:file:./data/cde_db   User: sa   Password: (leave blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Jackson date format ─────────────────────────────────────────────────────
# Serialize LocalDateTime as "2026-05-01T10:30:00" instead of an array
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.web=DEBUG
